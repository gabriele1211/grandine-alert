<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#061b2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Grandine Alert" />
    <meta name="description" content="Radar locale e stima del rischio grandine nelle prossime ore." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/grandine-alert-apple-v3.png" />
    <title>Grandine Alert</title>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        if (!params.has("force-update") && !params.has("update")) return;
        window.__grandineUpdating = true;
        const target = params.get("force-update") || params.get("update") || "1.1.18";
        Promise.all([
          "caches" in window
            ? caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith("grandine-alert-")).map(key => caches.delete(key))))
            : Promise.resolve(),
          "serviceWorker" in navigator
            ? navigator.serviceWorker.getRegistrations().then(items => Promise.all(items.map(item => item.unregister())))
            : Promise.resolve()
        ]).finally(() => location.replace(`./?updated=${encodeURIComponent(target)}&t=${Date.now()}`));
      })();
    </script>
    <script type="module">
      if (!window.__grandineUpdating) import("./assets/index-v1.1.18.js");
    </script>
  <link rel="stylesheet" crossorigin href="./assets/index-v1.1.18.css">
  <link rel="stylesheet" href="./assets/map-label-fix.css?v=1.1.18">
  </head>
  <body><div id="root"></div></body>
</html>
